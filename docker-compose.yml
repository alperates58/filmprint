services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-filmprint}:${POSTGRES_PASSWORD:-filmprint_dev_secret}@postgres:5432/${POSTGRES_DB:-filmprint}?schema=public
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      SESSION_SECRET: ${SESSION_SECRET:-filmprint_anonymous_session_secret_32chars}
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: filmprint-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-filmprint}
      POSTGRES_USER: ${POSTGRES_USER:-filmprint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-filmprint_dev_secret}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-filmprint} -d ${POSTGRES_DB:-filmprint}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
